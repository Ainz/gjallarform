name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Check PHP syntax
        run: php -l gjallarform/gjallarform.php
      - name: Run security helper tests
        run: php tests/security_helpers_test.php
      - name: Check JavaScript syntax
        run: node --check gjallarform/gjallarform.js
