<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thank You</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

  <div id="relmin-thankyou-root">
    <h4>Your message is on its way.</h4>
    <p>A confirmation email with a copy of your submission should arrive to your mailbox within a few minutes.</p>

    <div id="relmin-thankyou-details" hidden>
      <p><strong>Name:</strong> <span id="relmin-thankyou-name"></span></p>
      <p><strong>Subject:</strong> <span id="relmin-thankyou-subject"></span></p>
      <p><strong>Reference:</strong> <span id="relmin-thankyou-ref"></span></p>
    </div>

    <p>If it doesn't, please check spam/junk folders and verify the e-mail address you entered.</p>
    <p><a href="/contact.html">Back to contact</a></p>
  </div>

  <script src="/relmin/relmin.js" defer></script>
</body>
</html>
