<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <main class="gjallarform-wrapper">
    <form class="gjallarform" action="/gjallarform/gjallarform.php" method="post" novalidate>
      <label>Name <input type="text" name="fullname" required maxlength="200"></label>
      <label>Email <input type="email" name="email" required maxlength="254"></label>
      <label>Subject <input type="text" name="subject" required maxlength="300"></label>
      <label class="gjallarform__span-2">Message <textarea name="message" required maxlength="10000"></textarea></label>
      <label class="gjallarform__math" hidden>Quick check: <span id="math-question"></span> <input type="text" name="math_answer" inputmode="numeric" pattern="[0-9]+" title="Please enter numbers only" maxlength="6"></label>
      <input type="hidden" name="challenge_token" value="">
      <div class="gjallarform__hp" aria-hidden="true">
        <label>Leave this field empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      </div>
      <p class="gjallarform__status gjallarform__span-2" role="status" aria-live="polite"></p>
      <p class="gjallarform__privacy gjallarform__span-2">This form uses temporary, pseudonymous network data to limit abuse. See our <a href="/privacy-policy.html">privacy notice</a>.</p>
      <div class="gjallarform__actions gjallarform__span-2">
        <button type="submit" disabled>Send message</button>
      </div>
    </form>
    <noscript>This contact form requires JavaScript to obtain its signed anti-abuse challenge.</noscript>
  </main>
  <script src="/gjallarform/gjallarform.js" defer></script>
</body>
</html>
