<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <main class="gjallarform-wrapper">
    <form class="gjallarform" action="/gjallarform/gjallarform.php" method="post" novalidate>
      <label>Name <input type="text" name="fullname" required maxlength="200"></label>
      <label>Email <input type="email" name="email" required maxlength="254"></label>
      <label>Subject <input type="text" name="subject" required maxlength="300"></label>
      <label class="gjallarform__span-2">Message <textarea name="message" required maxlength="10000"></textarea></label>
      <label id="math-challenge-label">Quick check: <span id="math-question"></span> <input type="text" name="math_answer" required pattern="[0-9]+" title="Please enter numbers only" maxlength="6"></label>
      <!-- anti-abuse -->
      <input type="hidden" name="render_ts" value="">
      <input type="hidden" name="form_key" value="yoursite-change-this-to-a-long-random-secret">
      <input type="hidden" name="math_index" value="">
      <input type="text" name="website" class="hp" autocomplete="off">
      <div class="gjallarform__actions gjallarform__span-2">
        <button type="submit">Send message</button>
      </div>
    </form>
  </main>
  <script src="/gjallarform/gjallarform.js" defer></script>
</body>
</html>
