<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <style>
      .title{font-size:24px;font-weight:700;fill:#172b4d}.label{font-size:15px;font-weight:650;fill:#172b4d}.note{font-size:12px;fill:#42526e}.line{stroke:#52606d;stroke-width:2;marker-end:url(#arrow)}.browser{fill:#e8f4fd;stroke:#2684ff;stroke-width:1.5}.gate{fill:#f3f0ff;stroke:#6554c0;stroke-width:1.5}.step{fill:#e3fcef;stroke:#00875a;stroke-width:1.5}.error{fill:#ffebe6;stroke:#de350b;stroke-width:1.5}.success{fill:#e3fcef;stroke:#00875a;stroke-width:2}
    </style>
  </defs>

  <text x="360" y="38" text-anchor="middle" class="title">Gjallarform 0.96 request flow</text>

  <rect x="190" y="65" width="340" height="58" rx="9" class="browser"/>
  <text x="360" y="90" text-anchor="middle" class="label">Browser loads form and JavaScript</text>
  <text x="360" y="109" text-anchor="middle" class="note">Submit remains disabled</text>
  <line x1="360" y1="123" x2="360" y2="150" class="line"/>

  <rect x="190" y="152" width="340" height="62" rx="9" class="browser"/>
  <text x="360" y="177" text-anchor="middle" class="label">GET ?gjf_challenge=1</text>
  <text x="360" y="197" text-anchor="middle" class="note">No-cache, same-origin request</text>
  <line x1="360" y1="214" x2="360" y2="241" class="line"/>

  <rect x="170" y="243" width="380" height="70" rx="9" class="step"/>
  <text x="360" y="267" text-anchor="middle" class="label">PHP signs timestamp + nonce + question index</text>
  <text x="360" y="288" text-anchor="middle" class="note">HMAC with server-only formSecret</text>
  <text x="360" y="304" text-anchor="middle" class="note">Browser displays question and enables Submit</text>
  <line x1="360" y1="313" x2="360" y2="340" class="line"/>

  <rect x="210" y="342" width="300" height="52" rx="9" class="browser"/>
  <text x="360" y="374" text-anchor="middle" class="label">POST contact submission</text>
  <line x1="360" y1="394" x2="360" y2="421" class="line"/>

  <rect x="210" y="423" width="300" height="58" rx="9" class="gate"/>
  <text x="360" y="448" text-anchor="middle" class="label">Honeypot empty?</text>
  <text x="360" y="467" text-anchor="middle" class="note">Filled → silent success, no mail</text>
  <line x1="360" y1="481" x2="360" y2="508" class="line"/>

  <rect x="170" y="510" width="380" height="66" rx="9" class="gate"/>
  <text x="360" y="536" text-anchor="middle" class="label">Challenge signature, age, and timing valid?</text>
  <text x="360" y="557" text-anchor="middle" class="note">Invalid, expired, or too fast → error redirect</text>
  <line x1="360" y1="576" x2="360" y2="603" class="line"/>

  <rect x="190" y="605" width="340" height="58" rx="9" class="gate"/>
  <text x="360" y="630" text-anchor="middle" class="label">Math answer correct?</text>
  <text x="360" y="649" text-anchor="middle" class="note">When enabled; wrong → error redirect</text>
  <line x1="360" y1="663" x2="360" y2="690" class="line"/>

  <rect x="170" y="692" width="380" height="66" rx="9" class="gate"/>
  <text x="360" y="718" text-anchor="middle" class="label">Rate limit allows this IP hash?</text>
  <text x="360" y="739" text-anchor="middle" class="note">Locked file counter; blocked → Retry-After + redirect</text>
  <line x1="360" y1="758" x2="360" y2="785" class="line"/>

  <rect x="180" y="787" width="360" height="66" rx="9" class="gate"/>
  <text x="360" y="813" text-anchor="middle" class="label">Fields and email valid?</text>
  <text x="360" y="834" text-anchor="middle" class="note">Presence, byte limits, ASCII email, header sanitation</text>
  <line x1="360" y1="853" x2="360" y2="880" class="line"/>

  <rect x="190" y="882" width="340" height="62" rx="9" class="step"/>
  <text x="360" y="907" text-anchor="middle" class="label">Send admin notification</text>
  <text x="360" y="927" text-anchor="middle" class="note">Reply-To is the validated visitor address</text>
  <line x1="360" y1="944" x2="360" y2="971" class="line"/>

  <rect x="190" y="973" width="340" height="58" rx="9" class="step"/>
  <text x="360" y="998" text-anchor="middle" class="label">Optional confirmation copy</text>
  <text x="360" y="1017" text-anchor="middle" class="note">Disabled by default; failure is logged</text>
  <line x1="360" y1="1031" x2="360" y2="1055" class="line"/>

  <rect x="220" y="1057" width="280" height="46" rx="23" class="success"/>
  <text x="360" y="1085" text-anchor="middle" class="label">303 → thank-you page</text>

  <rect x="570" y="510" width="125" height="248" rx="9" class="error"/>
  <text x="632" y="536" text-anchor="middle" class="label">Failure path</text>
  <text x="632" y="562" text-anchor="middle" class="note">Draft remains in</text>
  <text x="632" y="579" text-anchor="middle" class="note">sessionStorage</text>
  <text x="632" y="610" text-anchor="middle" class="note">303 redirect with</text>
  <text x="632" y="627" text-anchor="middle" class="note">a short err code</text>
  <text x="632" y="658" text-anchor="middle" class="note">Fresh challenge</text>
  <text x="632" y="675" text-anchor="middle" class="note">loaded on return</text>
  <text x="632" y="706" text-anchor="middle" class="note">No internals or</text>
  <text x="632" y="723" text-anchor="middle" class="note">secrets exposed</text>
</svg>
