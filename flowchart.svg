<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1080" font-family="sans-serif" font-size="13">
  <!-- legend -->
  <rect x="20" y="340" width="130" height="110" rx="6" fill="#f5f5f5" stroke="#ccc"/>
  <text x="30" y="358" font-size="12" font-weight="bold">Legend</text>
  <rect x="30" y="365" width="16" height="12" rx="3" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="52" y="376" font-size="11">Decision / gate</text>
  <rect x="30" y="383" width="16" height="12" rx="3" fill="#cce8f8" stroke="#90c0e0"/>
  <text x="52" y="394" font-size="11">Processing step</text>
  <rect x="30" y="401" width="16" height="12" rx="3" fill="#c8ecd5" stroke="#70c080"/>
  <text x="52" y="412" font-size="11">Success exit</text>
  <rect x="30" y="419" width="16" height="12" rx="3" fill="#f8c8c8" stroke="#e07070"/>
  <text x="52" y="430" font-size="11">Error redirect</text>

  <!-- helpers: center x=280, box w=200, box h=44, gap=20, err box w=110 at x=430 -->

  <!-- START -->
  <rect x="180" y="20" width="200" height="36" rx="18" fill="#e8e8e8" stroke="#aaa"/>
  <text x="280" y="43" text-anchor="middle" font-size="13">POST request received</text>

  <!-- arrow -->
  <line x1="280" y1="56" x2="280" y2="76" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 1: form_disabled? -->
  <rect x="180" y="76" width="200" height="50" rx="6" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="280" y="97" text-anchor="middle" font-weight="bold">form_disabled?</text>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#666">Emergency kill switch</text>
  <!-- yes → 503 -->
  <line x1="380" y1="101" x2="430" y2="101" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="400" y="96" font-size="11">yes</text>
  <rect x="430" y="79" width="100" height="36" rx="6" fill="#f8c8c8" stroke="#e07070"/>
  <text x="480" y="102" text-anchor="middle" font-weight="bold">503 exit</text>
  <!-- no ↓ -->
  <line x1="280" y1="126" x2="280" y2="146" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="140" font-size="11">no</text>

  <!-- 2: Method=POST? -->
  <rect x="180" y="146" width="200" height="44" rx="6" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="280" y="172" text-anchor="middle" font-weight="bold">Method = POST?</text>
  <!-- no → 405 -->
  <line x1="380" y1="168" x2="430" y2="168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="400" y="163" font-size="11">no</text>
  <rect x="430" y="148" width="100" height="36" rx="6" fill="#f8c8c8" stroke="#e07070"/>
  <text x="480" y="171" text-anchor="middle" font-weight="bold">405 exit</text>
  <!-- yes ↓ -->
  <line x1="280" y1="190" x2="280" y2="210" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="204" font-size="11">yes</text>

  <!-- 3: Honeypot filled? -->
  <rect x="180" y="210" width="200" height="50" rx="6" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="280" y="231" text-anchor="middle" font-weight="bold">Honeypot filled?</text>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#666">website field non-empty</text>
  <!-- yes → Fake TY -->
  <line x1="380" y1="235" x2="430" y2="235" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="400" y="230" font-size="11">yes</text>
  <rect x="430" y="215" width="100" height="36" rx="6" fill="#c8ecd5" stroke="#70c080"/>
  <text x="480" y="238" text-anchor="middle" font-weight="bold">Fake TY</text>
  <!-- no ↓ -->
  <line x1="280" y1="260" x2="280" y2="280" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="274" font-size="11">no</text>

  <!-- 4: Form key valid? -->
  <rect x="180" y="280" width="200" height="50" rx="6" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="280" y="301" text-anchor="middle" font-weight="bold">Form key valid?</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#666">hash_equals check</text>
  <!-- fail → err -->
  <line x1="380" y1="305" x2="430" y2="305" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="398" y="300" font-size="11">fail</text>
  <rect x="430" y="285" width="110" height="36" rx="6" fill="#f8c8c8" stroke="#e07070"/>
  <text x="485" y="308" text-anchor="middle" font-weight="bold">err redirect</text>
  <!-- pass ↓ -->
  <line x1="280" y1="330" x2="280" y2="350" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="344" font-size="11">pass</text>

  <!-- 5: Math challenge correct? -->
  <rect x="180" y="350" width="200" height="50" rx="6" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="280" y="371" text-anchor="middle" font-weight="bold">Math challenge correct?</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#666">MD5(formKey+host) index + answer</text>
  <!-- fail → err -->
  <line x1="380" y1="375" x2="430" y2="375" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="398" y="370" font-size="11">fail</text>
  <rect x="430" y="355" width="110" height="36" rx="6" fill="#f8c8c8" stroke="#e07070"/>
  <text x="485" y="378" text-anchor="middle" font-weight="bold">err redirect</text>
  <!-- pass ↓ -->
  <line x1="280" y1="400" x2="280" y2="420" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="414" font-size="11">pass</text>

  <!-- 6: Time trap passed? -->
  <rect x="180" y="420" width="200" height="50" rx="6" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="280" y="441" text-anchor="middle" font-weight="bold">Time trap passed?</text>
  <text x="280" y="458" text-anchor="middle" font-size="11" fill="#666">elapsed + grace &gt;= minMs</text>
  <!-- too fast → err -->
  <line x1="380" y1="445" x2="430" y2="445" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390" y="440" font-size="11">too fast</text>
  <rect x="430" y="425" width="110" height="36" rx="6" fill="#f8c8c8" stroke="#e07070"/>
  <text x="485" y="448" text-anchor="middle" font-weight="bold">err redirect</text>
  <!-- pass ↓ -->
  <line x1="280" y1="470" x2="280" y2="490" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="484" font-size="11">pass</text>

  <!-- 7: Required fields present? -->
  <rect x="180" y="490" width="200" height="50" rx="6" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="280" y="511" text-anchor="middle" font-weight="bold">Required fields present?</text>
  <text x="280" y="528" text-anchor="middle" font-size="11" fill="#666">name, email, message</text>
  <!-- missing → err -->
  <line x1="380" y1="515" x2="430" y2="515" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="393" y="510" font-size="11">missing</text>
  <rect x="430" y="495" width="110" height="36" rx="6" fill="#f8c8c8" stroke="#e07070"/>
  <text x="485" y="518" text-anchor="middle" font-weight="bold">err redirect</text>
  <!-- pass ↓ -->
  <line x1="280" y1="540" x2="280" y2="560" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="554" font-size="11">pass</text>

  <!-- 8: Field lengths valid? -->
  <rect x="180" y="560" width="200" height="50" rx="6" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="280" y="581" text-anchor="middle" font-weight="bold">Field lengths valid?</text>
  <text x="280" y="598" text-anchor="middle" font-size="11" fill="#666">name/email/subject/message</text>
  <!-- exceeded → err -->
  <line x1="380" y1="585" x2="430" y2="585" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="392" y="580" font-size="11">exceeded</text>
  <rect x="430" y="565" width="110" height="36" rx="6" fill="#f8c8c8" stroke="#e07070"/>
  <text x="485" y="588" text-anchor="middle" font-weight="bold">err redirect</text>
  <!-- pass ↓ -->
  <line x1="280" y1="610" x2="280" y2="630" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="624" font-size="11">pass</text>

  <!-- 9: Email valid? -->
  <rect x="180" y="630" width="200" height="50" rx="6" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="280" y="651" text-anchor="middle" font-weight="bold">Email valid?</text>
  <text x="280" y="668" text-anchor="middle" font-size="11" fill="#666">ASCII, single @, regex</text>
  <!-- invalid → err -->
  <line x1="380" y1="655" x2="430" y2="655" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="396" y="650" font-size="11">invalid</text>
  <rect x="430" y="635" width="110" height="36" rx="6" fill="#f8c8c8" stroke="#e07070"/>
  <text x="485" y="658" text-anchor="middle" font-weight="bold">err redirect</text>
  <!-- valid ↓ -->
  <line x1="280" y1="680" x2="280" y2="700" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="694" font-size="11">valid</text>

  <!-- 10: Compose email -->
  <rect x="180" y="700" width="200" height="50" rx="6" fill="#cce8f8" stroke="#90c0e0"/>
  <text x="280" y="721" text-anchor="middle" font-weight="bold">Compose email</text>
  <text x="280" y="738" text-anchor="middle" font-size="11" fill="#666">ref, timestamp, headers</text>
  <line x1="280" y1="750" x2="280" y2="770" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 11: Admin mail sent? -->
  <rect x="180" y="770" width="200" height="50" rx="6" fill="#dbd8f5" stroke="#a090d0"/>
  <text x="280" y="791" text-anchor="middle" font-weight="bold">Admin mail sent?</text>
  <text x="280" y="808" text-anchor="middle" font-size="11" fill="#666">php mail() required</text>
  <!-- fail → err -->
  <line x1="380" y1="795" x2="430" y2="795" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="398" y="790" font-size="11">fail</text>
  <rect x="430" y="775" width="110" height="36" rx="6" fill="#f8c8c8" stroke="#e07070"/>
  <text x="485" y="798" text-anchor="middle" font-weight="bold">err redirect</text>
  <!-- ok ↓ -->
  <line x1="280" y1="820" x2="280" y2="840" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="834" font-size="11">ok</text>

  <!-- 12: Send confirmation -->
  <rect x="180" y="840" width="200" height="50" rx="6" fill="#cce8f8" stroke="#90c0e0"/>
  <text x="280" y="861" text-anchor="middle" font-weight="bold">Send confirmation</text>
  <text x="280" y="878" text-anchor="middle" font-size="11" fill="#666">best-effort, no error on fail</text>
  <line x1="280" y1="890" x2="280" y2="910" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- END -->
  <rect x="180" y="910" width="200" height="50" rx="6" fill="#c8ecd5" stroke="#70c080"/>
  <text x="280" y="931" text-anchor="middle" font-weight="bold">303 → thankyou.html</text>
  <text x="280" y="948" text-anchor="middle" font-size="11" fill="#666">PRG pattern, script exits</text>

  <!-- arrowhead marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
